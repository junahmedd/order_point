<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OrderPoint Pro</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#030B1C" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Disable Stale Caching on Mobile -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- Apple Mobile Web App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OrderPoint Pro" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Razorpay Checkout SDK for Google Pay & UPI payments -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="bg-[#030B1C] select-none md:select-auto">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
